<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Farmer</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <link rel="stylesheet" href="farmer.css">
</head>
<body>

<div class="container mt-5">
    <div class="card farmer-card">
        <div class="card-header text-center bg-success text-white">
            <h4>Add Farmer</h4>
        </div>

        <div class="card-body">
            <form>
                <table class="table table-borderless">
                    <tr>
                        <td><label>Farmer Name</label></td>
                        <td><input type="text" class="form-control" placeholder="Enter name"></td>
                    </tr>

                    <tr>
                        <td><label>National ID</label></td>
                        <td><input type="text" class="form-control" placeholder="Enter ID number"></td>
                    </tr>

                    <tr>
                        <td><label>Phone Number</label></td>
                        <td><input type="tel" class="form-control" placeholder="Enter phone"></td>
                    </tr>

                    <tr>
                        <td><label>Farm Location</label></td>
                        <td><input type="text" class="form-control" placeholder="Enter location"></td>
                    </tr>

                    <tr>
                        <td><label>Type of Farming</label></td>
                        <td>
                            <select class="form-control">
                                <option>Crop Farming</option>
                                <option>Livestock Farming</option>
                                <option>Mixed Farming</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" class="text-center">
                            <button type="submit" class="btn btn-success">
                                Add Farmer
                            </button>
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
</div>

</body>
</html>
